<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css?v=4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Universal sleek scrollbar */
    html, body, *, *::before, *::after {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent !important;
    }
    ::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    ::-webkit-scrollbar-track, *::-webkit-scrollbar-track {
      background: transparent !important;
    }
    ::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
    }
    ::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45) !important;
    }
    ::-webkit-scrollbar-button, *::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font-main, 'Titillium Web', sans-serif); min-height: 100vh; overflow-x: hidden; }
    canvas#waves { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.65; }

    .admin-container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 40px 20px; }

    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .admin-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; }
    .admin-header h1 span { color: var(--text); }
    .admin-badge { background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-left: 8px; letter-spacing: 0.04em; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }
    .stat-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .stat-card .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin-bottom: 6px; }
    .stat-card .stat-value { font-size: 30px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; }

    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
      margin-bottom: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 40px -16px rgba(0, 0, 0, 0.7);
    }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.015em; }

    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th { text-align: left; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .user-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); font-size: 14px; }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr:hover td { background: rgba(255, 255, 255, 0.03); }

    .user-email { color: var(--text); font-weight: 500; }
    .user-roblox { color: var(--text-secondary); font-size: 13px; }
    .user-plan { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; letter-spacing: 0.02em; }
    .user-plan.basic { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
    .user-plan.premium { background: #ffffff; color: #000000; }
    .user-plan.none { background: var(--border); color: var(--text-muted); }

    .btn-danger { background: rgba(239, 68, 68, 0.12); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.25); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.18s ease; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }

    .blocked-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .blocked-tag { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.25); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .blocked-tag button { background: none; border: none; color: var(--error); cursor: pointer; font-size: 14px; line-height: 1; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    .error-msg { background: rgba(239,68,68,0.12); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.25); padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="admin-container">
    <div class="admin-header">
      <h1><span>Sky</span> Admin <span class="admin-badge">ADMIN</span></h1>
      <a href="dashboard.html" style="color:var(--text-secondary);text-decoration:none;font-size:13px;">← Back to Dashboard</a>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="statUsers">—</div></div>
      <div class="stat-card"><div class="stat-label">Basic Plans</div><div class="stat-value" id="statBasic">—</div></div>
      <div class="stat-card"><div class="stat-label">Premium Plans</div><div class="stat-value" id="statPremium">—</div></div>
      <div class="stat-card"><div class="stat-label">Blocked IDs</div><div class="stat-value" id="statBlocked">—</div></div>
    </div>

    <div class="section">
      <div class="section-title"><i class="fas fa-users"></i> Users</div>
      <div id="usersContent"><div class="loading">Loading...</div></div>
    </div>

    <div class="section">
      <div class="section-title"><i class="fas fa-ban"></i> Blocked Roblox IDs</div>
      <div id="blockedContent"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('sky_token');
    if (!token) window.location.href = 'login.html';

    let allData = null;

    async function loadAdmin() {
      try {
        const res = await fetch('/api/admin-users', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) { document.getElementById('usersContent').innerHTML = '<div class="error-msg">Access denied. Admin only.</div>'; return; }
        allData = await res.json();
        renderStats();
        renderUsers();
        renderBlocked();
      } catch (e) {
        document.getElementById('usersContent').innerHTML = '<div class="error-msg">Failed to load data.</div>';
      }
    }

    function renderStats() {
      const users = allData.users || [];
      const basic = users.filter(u => u.plan === 'basic').length;
      const premium = users.filter(u => u.plan === 'premium').length;
      document.getElementById('statUsers').textContent = users.length;
      document.getElementById('statBasic').textContent = basic;
      document.getElementById('statPremium').textContent = premium;
      document.getElementById('statBlocked').textContent = (allData.robloxUsedIds || []).length;
    }

    function renderUsers() {
      const users = allData.users || [];
      if (users.length === 0) { document.getElementById('usersContent').innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No users yet.</div>'; return; }
      let html = '<table class="user-table"><thead><tr><th>Email</th><th>Roblox</th><th>Plan</th><th>Purchased</th><th></th></tr></thead><tbody>';
      for (const u of users) {
        const planClass = u.plan || 'none';
        const planLabel = u.plan ? u.plan.charAt(0).toUpperCase() + u.plan.slice(1) : 'None';
        const date = u.purchasedAt ? new Date(u.purchasedAt).toLocaleDateString() : '—';
        html += `<tr>
          <td class="user-email">${u.email || '—'}</td>
          <td class="user-roblox">${u.robloxUser || '—'} <span style="color:var(--text-muted)">(${u.robloxUserId || '—'})</span></td>
          <td><span class="user-plan ${planClass}">${planLabel}</span></td>
          <td style="color:var(--text-muted);font-size:12px;">${date}</td>
          <td><button class="btn-danger" onclick="deleteUser('${u.email}')">Delete</button></td>
        </tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('usersContent').innerHTML = html;
    }

    function renderBlocked() {
      const ids = allData.robloxUsedIds || [];
      if (ids.length === 0) { document.getElementById('blockedContent').innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No blocked IDs.</div>'; return; }
      let html = '<div class="blocked-list">';
      for (const id of ids) {
        html += `<div class="blocked-tag">${id} <button onclick="unblockId('${id}')">&times;</button></div>`;
      }
      html += '</div>';
      document.getElementById('blockedContent').innerHTML = html;
    }

    async function deleteUser(email) {
      if (!confirm('Delete ' + email + '?')) return;
      await fetch('/api/admin-users', {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetEmail: email })
      });
      loadAdmin();
    }

    async function unblockId(id) {
      if (!confirm('Unblock Roblox ID ' + id + '?')) return;
      await fetch('/api/admin-users', {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetUserId: id })
      });
      loadAdmin();
    }

    loadAdmin();
  </script>

  <script src="three.min.js"></script>
  <script src="vanta.clouds.min.js?v=10"></script>
  <script src="waves.js?v=14"></script>
</body>
</html>
