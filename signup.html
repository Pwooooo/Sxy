<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css?v=4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Universal sleek scrollbar */
    html, body, *, *::before, *::after {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent !important;
    }
    ::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    ::-webkit-scrollbar-track, *::-webkit-scrollbar-track {
      background: transparent !important;
    }
    ::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
    }
    ::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45) !important;
    }
    ::-webkit-scrollbar-button, *::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-main, 'Titillium Web', sans-serif);
      min-height: 100vh; overflow-x: hidden;
    }
    canvas#waves { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.65; }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

    .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .nav-logo { font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.02em; font-family: var(--font-main, 'Titillium Web', sans-serif); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: color 0.18s ease; }
    .nav-link:hover { color: #ffffff; }
    .nav-link svg { width: 18px !important; height: 18px !important; flex-shrink: 0 !important; display: inline-block !important; }

    .auth-container {
      max-width: 420px; margin: auto; padding: 20px; width: 100%;
      animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 24px 60px -16px rgba(0, 0, 0, 0.8);
    }

    .auth-title { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; text-align: center; }
    .auth-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; text-align: center; }

    .btn-discord svg, .btn-google svg {
      width: 20px !important;
      height: 20px !important;
      max-width: 20px !important;
      max-height: 20px !important;
      min-width: 20px !important;
      min-height: 20px !important;
      flex-shrink: 0 !important;
      display: inline-block !important;
      vertical-align: middle !important;
    }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }

    .btn-primary { width: 100%; height: 44px; margin-top: 8px; }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary); }
    .auth-footer a { color: var(--text); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    .divider { display: flex; align-items: center; gap: 16px; margin: 18px 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; margin-top: auto; }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="page">
    <nav class="nav">
      <a href="index.html" class="nav-logo">Sky</a>
      <div class="nav-links">
        <a href="purchase.html" class="nav-link">Purchase</a>
        <a href="login.html" class="nav-link">Log In</a>
        <a href="#" class="nav-link">FAQ</a>
        <a href="https://discord.gg/KnM7M7pGeh" class="nav-link" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;flex-shrink:0;display:inline-block;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Discord
        </a>
      </div>
    </nav>

    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-title">Create an account</div>
        <div class="auth-subtitle">Enter your details to get started</div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="signupUsername" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="signupPassword" placeholder="Create a password">
        </div>
        <div id="signupError" style="color:#ef4444; font-size:13px; margin-bottom:12px; display:none;"></div>
        <button class="btn-primary" id="signupBtn" onclick="doSignup()">Sign Up</button>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>

    <footer class="footer">© 2026 Sky</footer>
  </div>

  <script>
    if (localStorage.getItem('sky_token')) {
      window.location.href = 'dashboard.html';
    }

    async function doSignup() {
      const email = document.getElementById('signupEmail').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const errEl = document.getElementById('signupError');
      const btn = document.getElementById('signupBtn');

      errEl.style.display = 'none';

      if (!email || !username || !password) {
        errEl.textContent = 'Please fill in all fields';
        errEl.style.display = 'block';
        return;
      }

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        errEl.textContent = 'Username must be 3-20 characters and only letters, numbers, and underscores';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Signup failed';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign Up';
          return;
        }

        localStorage.setItem('sky_token', data.token);
        localStorage.setItem('sky_user', data.user.username);
        localStorage.setItem('sky_email', data.user.email);
        window.location.href = 'dashboard.html';
      } catch (e) {
        errEl.textContent = 'Network error — try again';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    }
  </script>

  <script src="three.min.js"></script>
  <script src="vanta.clouds.min.js?v=6"></script>
  <script src="waves.js?v=10"></script>
</body>
</html>
