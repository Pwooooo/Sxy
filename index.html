<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky — Run every script.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css?v=4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Universal sleek scrollbar */
    html, body, *, *::before, *::after {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent !important;
    }
    ::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    ::-webkit-scrollbar-track, *::-webkit-scrollbar-track {
      background: transparent !important;
    }
    ::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
    }
    ::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45) !important;
    }
    ::-webkit-scrollbar-button, *::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main, 'Titillium Web', sans-serif);
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas#waves {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
      font-family: var(--font-main, 'Titillium Web', sans-serif);
    }

    .nav-links { display: flex; align-items: center; gap: 24px; }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.18s ease;
    }
    .nav-link:hover { color: #ffffff; }
    .nav-link svg { width: 18px; height: 18px; }

    .hero {
      text-align: center;
      padding: 30px 20px 50px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero-title {
      font-size: clamp(34px, 5vw, 62px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 10px;
    }

    .hero-title span {
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: clamp(14px, 1.3vw, 17px);
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.5;
      max-width: 540px;
      margin: 0 auto 24px;
      letter-spacing: -0.01em;
    }

    .hero-img-wrap {
      position: relative;
      display: inline-block;
      margin: 0 auto 30px;
    }

    .hero-img {
      max-width: min(480px, 86vw);
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 20px 48px rgba(0, 0, 0, 0.85));
      user-select: none;
    }

    .hero-img-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 12, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .hero-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <div class="page">
    <nav class="nav">
      <a href="index.html" class="nav-logo">Sky</a>

      <div class="nav-links">
        <a href="purchase.html" class="nav-link">Pricing</a>
        <a href="login.html" class="nav-link">Log In</a>
        <a href="https://discord.gg/KnM7M7pGeh" class="nav-link" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;flex-shrink:0;display:inline-block;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Discord
        </a>
      </div>
    </nav>

    <section class="hero">
      <h1 class="hero-title">Next-Gen <span>Execution.</span></h1>
      <p class="hero-subtitle">Engineered for unmatched stability, speed, and precision.</p>

      <div class="hero-img-wrap">
        <img src="hero-logo.png" alt="Sky" class="hero-img">
        <div class="hero-img-overlay">SKY v1.0 · THE NEXT GENERATION</div>
      </div>

      <div class="hero-cta">
        <a id="heroBtn" href="signup.html" class="btn btn-primary">Get Started</a>
        <a href="purchase.html" class="btn btn-outline">See Pricing</a>
      </div>
    </section>

    <footer class="footer">© 2026 Sky</footer>
  </div>

  <script src="three.min.js"></script>
  <script src="vanta.clouds.min.js"></script>
  <script src="waves.js?v=5"></script>
  <script>
    if (localStorage.getItem('sky_token')) {
      const btn = document.getElementById('heroBtn');
      btn.textContent = 'Dashboard';
      btn.href = 'dashboard.html';
    }
  </script>
</body>
</html>
