<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky — Run every script.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css?v=3">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Universal sleek scrollbar */
    html, body, *, *::before, *::after {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent !important;
    }
    ::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    ::-webkit-scrollbar-track, *::-webkit-scrollbar-track {
      background: transparent !important;
    }
    ::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
    }
    ::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45) !important;
    }
    ::-webkit-scrollbar-button, *::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main, 'Titillium Web', sans-serif);
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas#waves {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(48px, 7vw, 92px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.02;
      color: var(--text);
      margin-bottom: 20px;
    }

    .hero h1 span {
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-lede {
      font-size: clamp(17px, 1.6vw, 20px);
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.5;
      max-width: 620px;
      margin: 0 auto 36px;
      letter-spacing: -0.01em;
    }

    .hero-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <canvas id="waves"></canvas>

  <div class="page">
    <section class="hero">
      <h1 id="title">Run every <span>script.</span></h1>
      <p class="hero-lede">A modern Roblox development workspace for scripting, testing, and managing projects in one focused environment.</p>

      <div class="hero-cta">
        <a id="heroBtn" href="signup.html" class="btn btn-primary">Get Started</a>
        <a href="purchase.html" class="btn btn-outline">See Pricing</a>
      </div>
    </section>

    <footer class="footer">© 2026 Sky</footer>
  </div>

  <script>
    const canvas = document.getElementById('waves');
    const ctx = canvas.getContext('2d');
    let w, h, time = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function noise(x) {
      return Math.sin(x * 1.2) * 0.5 + Math.sin(x * 2.3) * 0.3 + Math.sin(x * 3.7) * 0.2;
    }

    function draw() {
      const cs = getComputedStyle(document.documentElement);
      const wc = cs.getPropertyValue('--wave-color').trim();
      ctx.clearRect(0, 0, w, h);
      const lines = 24;
      const spacing = h / lines;

      for (let i = 0; i < lines; i++) {
        ctx.beginPath();
        const yBase = i * spacing;
        const alpha = 0.08 + (Math.abs(i - lines / 2) / lines) * 0.12;
        ctx.strokeStyle = `rgba(${wc},${alpha})`;
        ctx.lineWidth = 1;

        for (let x = 0; x <= w; x += 3) {
          const xNorm = x / w;
          const wave1 = Math.sin(xNorm * 4 + time * 0.3 + i * 0.4) * 28;
          const wave2 = Math.sin(xNorm * 6 - time * 0.2 + i * 0.6) * 18;
          const wave3 = noise(xNorm * 3 + time * 0.1 + i * 0.3) * 20;
          const y = yBase + wave1 + wave2 + wave3;

          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      time += 0.006;
      requestAnimationFrame(draw);
    }
    draw();

    if (localStorage.getItem('sky_token')) {
      const btn = document.getElementById('heroBtn');
      btn.textContent = 'Dashboard';
      btn.href = 'dashboard.html';
    }
  </script>
</body>
</html>
