<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css?v=4">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Universal sleek scrollbar */
    html, body, *, *::before, *::after {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent !important;
    }
    ::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    ::-webkit-scrollbar-track, *::-webkit-scrollbar-track {
      background: transparent !important;
    }
    ::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22) !important;
      border-radius: 9999px !important;
    }
    ::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45) !important;
    }
    ::-webkit-scrollbar-button, *::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font-main, 'Titillium Web', sans-serif); min-height: 100vh; overflow-x: hidden; }
    canvas#waves { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.65; }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .nav-logo { font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.02em; font-family: var(--font-main, 'Titillium Web', sans-serif); display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: color 0.18s ease; }
    .nav-link:hover { color: #ffffff; }
    .nav-link svg { width: 18px; height: 18px; }

    .settings { max-width: 640px; margin: 40px auto 80px; padding: 0 20px; width: 100%; }
    .settings-header { margin-bottom: 36px; animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    .settings-title { font-size: clamp(28px, 4vw, 36px); font-weight: 800; letter-spacing: -0.025em; margin-bottom: 6px; }
    .settings-sub { font-size: 15px; color: var(--text-secondary); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .section { margin-bottom: 32px; animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .section:nth-child(2) { animation-delay: 0.05s; }
    .section:nth-child(3) { animation-delay: 0.1s; }
    .section:nth-child(4) { animation-delay: 0.15s; }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.015em; color: var(--text); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 40px -16px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .card-row { padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-light); }
    .card-row:last-child { border-bottom: none; }
    .card-label { font-size: 14px; font-weight: 500; color: var(--text); }
    .card-value { font-size: 14px; color: var(--text-secondary); font-family: var(--font-mono, 'Geist Mono', monospace); }
    .card-value.green { color: #22c55e; font-weight: 600; }

    .footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; margin-top: auto; }

    .custom-dropdown { position: relative; width: 100%; }
    .custom-dropdown-trigger {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: all 0.18s ease;
    }
    .custom-dropdown-trigger:hover { border-color: var(--border-hover); background: var(--bg-input-focus); }
    .custom-dropdown-trigger svg { width: 12px; height: 12px; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
    .custom-dropdown.open .custom-dropdown-trigger svg { transform: rotate(180deg); }
    .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0d0d10;
      border: 1px solid var(--border-hover);
      border-radius: 16px;
      padding: 6px;
      z-index: 999;
      display: none;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
    }
    .custom-dropdown.open .custom-dropdown-menu { display: block; }
    .custom-dropdown-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); transition: background 0.15s; }
    .custom-dropdown-option:hover { background: rgba(255, 255, 255, 0.08); }
    .custom-dropdown-option.active { background: rgba(255, 255, 255, 0.12); color: #fff; font-weight: 600; }
    .theme-swatch { width: 40px; height: 26px; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; }
    .theme-swatch-half { width: 50%; height: 100%; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="page">
    <nav class="nav">
      <a href="index.html" class="nav-logo">Sky</a>
      <div class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="purchase.html" class="nav-link">Purchase</a>
        <a href="https://discord.gg/KnM7M7pGeh" class="nav-link" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;min-width:18px;min-height:18px;max-width:18px;max-height:18px;flex-shrink:0;display:inline-block;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Discord
        </a>
      </div>
    </nav>

    <div class="settings">
      <div class="settings-header">
        <div class="settings-title">Settings</div>
        <div class="settings-sub">Manage your account settings</div>
      </div>

      <div class="section">
        <div class="section-title">Account</div>
        <div class="card">
          <div class="card-row">
            <div class="card-label">Username</div>
            <div class="card-value" id="sUsername">—</div>
          </div>
          <div class="card-row">
            <div class="card-label">Email</div>
            <div class="card-value" id="sEmail">—</div>
          </div>
          <div class="card-row">
            <div class="card-label">Plan</div>
            <div class="card-value" id="sPlan">—</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">License</div>
        <div class="card">
          <div class="card-row">
            <div class="card-label">License Key</div>
            <div class="card-value" id="sKey">—</div>
          </div>
          <div class="card-row">
            <div class="card-label">Roblox Account</div>
            <div class="card-value" id="sRoblox">—</div>
          </div>
        </div>
      </div>

      <div class="section" style="position: relative; z-index: 1000;">
        <div class="section-title">Appearance</div>
        <div class="card">
          <div class="card-row" style="flex-direction: column; align-items: stretch; gap: 12px;">
            <div class="card-label">Theme</div>
            <div class="custom-dropdown" id="themeDropdown">
              <div class="custom-dropdown-trigger" onclick="event.stopPropagation(); toggleDropdown()">
                <span id="themeLabel">Light</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <div class="custom-dropdown-menu">
                <div class="custom-dropdown-option" data-theme-choice="light" onclick="selectTheme('light')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#fafafa;"></div><div class="theme-swatch-half" style="background:#111;"></div></div>Light
                </div>
                <div class="custom-dropdown-option" data-theme-choice="dark" onclick="selectTheme('dark')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#1a1a1a;"></div><div class="theme-swatch-half" style="background:#e5e5e5;"></div></div>Dark
                </div>
                <div class="custom-dropdown-option" data-theme-choice="midnight" onclick="selectTheme('midnight')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#0a0a1a;"></div><div class="theme-swatch-half" style="background:#7777ff;"></div></div>Midnight
                </div>
                <div class="custom-dropdown-option" data-theme-choice="sakura" onclick="selectTheme('sakura')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#fff5f7;"></div><div class="theme-swatch-half" style="background:#e8729a;"></div></div>Sakura
                </div>
                <div class="custom-dropdown-option" data-theme-choice="nature" onclick="selectTheme('nature')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#f4f7f2;"></div><div class="theme-swatch-half" style="background:#2d7a2d;"></div></div>Nature
                </div>
                <div class="custom-dropdown-option" data-theme-choice="ocean" onclick="selectTheme('ocean')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#f0f7fa;"></div><div class="theme-swatch-half" style="background:#0e7490;"></div></div>Ocean
                </div>
                <div class="custom-dropdown-option" data-theme-choice="lavender" onclick="selectTheme('lavender')">
                  <div class="theme-swatch"><div class="theme-swatch-half" style="background:#f5f0fa;"></div><div class="theme-swatch-half" style="background:#7c3aed;"></div></div>Lavender
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Session</div>
        <div class="card">
          <div class="card-row">
            <div class="card-label">Log out of your account</div>
            <button class="btn btn-danger" onclick="doLogout()">Log Out</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">© 2026 Sky</footer>
  </div>

  <script>
    if (!localStorage.getItem('sky_token')) {
      window.location.href = 'login.html';
    }

    const user = localStorage.getItem('sky_user');
    const email = localStorage.getItem('sky_email');
    const plan = localStorage.getItem('sky_plan');
    const key = localStorage.getItem('sky_license');
    const roblox = localStorage.getItem('sky_roblox_user');

    if (user) document.getElementById('sUsername').textContent = user;
    if (email) document.getElementById('sEmail').textContent = email;
    if (plan) document.getElementById('sPlan').textContent = plan === 'basic' ? 'Basic' : 'Premium';
    if (key) document.getElementById('sKey').textContent = key;
    if (roblox) document.getElementById('sRoblox').textContent = roblox;

    function selectTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('sky_theme', theme);
      document.getElementById('themeLabel').textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
      document.querySelectorAll('.custom-dropdown-option').forEach(o => {
        o.classList.toggle('active', o.getAttribute('data-theme-choice') === theme);
      });
      document.getElementById('themeDropdown').classList.remove('open');
    }

    function toggleDropdown() {
      document.getElementById('themeDropdown').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      if (!document.getElementById('themeDropdown').contains(e.target)) {
        document.getElementById('themeDropdown').classList.remove('open');
      }
    });

    const currentTheme = localStorage.getItem('sky_theme') || 'light';
    selectTheme(currentTheme);

    function doLogout() {
      localStorage.removeItem('sky_token');
      localStorage.removeItem('sky_user');
      localStorage.removeItem('sky_email');
      localStorage.removeItem('sky_plan');
      localStorage.removeItem('sky_license');
      localStorage.removeItem('sky_roblox_user');
      window.location.href = 'index.html';
    }
  </script>

  <script src="three.min.js"></script>
  <script src="vanta.clouds.min.js?v=7"></script>
  <script src="waves.js?v=11"></script>
</body>
</html>
